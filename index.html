        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap');

        .navBtn:hover { background: ${r.paper}; color: ${r.ink}; }

        .navIcon { width: 18px; text-align: center; font-size: 14px; }
        .navBadge { margin-left: auto; background: ${r.paper}; color: ${r.inkSoft}; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px; }
        .navBtn.on .navBadge { background: ${r.rose}; color: ${r.onAcc}; }
        .subNav { margin: 2px 0 6px 30px; border-left: 1px solid ${r.line}; }

        .subBtn:hover { color: ${r.ink}; }
        .subBtn.on { color: ${r.ink}; border-left-color: ${r.rose}; background: ${r.paper}; border-radius: 0 8px 8px 0; }
        .sideFoot { border-top: 1px solid ${r.line}; padding: 12px 10px; }
        .sideFootLbl { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: ${r.inkSoft}; padding: 0 12px 6px; }
        .roleBtn { width: 100%; text-align: left; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: ${r.inkSoft}; padding: 8px 12px; border-radius: 9px; cursor: pointer; }
        .roleBtn:hover { background: ${r.paper}; }

        .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

        .pageTitle { font-size: 23px; font-weight: 700; }
