        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; }
        .app { min-height: 100vh; background: ${p.bg}; color: ${p.ink}; font-family: 'Manrope', sans-serif; font-size: 14px; }
        .shell { display: flex; min-height: 100vh; }
        .side { width: 232px; min-width: 232px; background: ${p.card}; border-right: 1px solid ${p.line}; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
        .sideTop { display: flex; align-items: center; gap: 10px; padding: 18px 16px; border-bottom: 1px solid ${p.line}; }
        .sideMark { width: 32px; height: 32px; border-radius: 9px; background: ${p.rose}; color: ${p.onAcc}; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; }
        .sideName { font-weight: 700; font-size: 15px; line-height: 1.15; }
        .sideName span { display: block; font-size: 10.5px; letter-spacing: 1.3px; text-transform: uppercase; color: ${p.inkSoft}; font-weight: 600; }
        .sideNav { flex: 1; overflow-y: auto; padding: 12px 10px; }
        .navBtn { width: 100%; display: flex; align-items: center; gap: 11px; border: 0; background: transparent; font: inherit; font-weight: 600; font-size: 13.5px; color: ${p.inkSoft}; padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left; }
        .navBtn:hover { background: ${p.paper}; color: ${p.ink}; }
        .navBtn.on { background: ${p.roseSoft}; color: ${p.rose}; }
        .navIcon { width: 18px; text-align: center; font-size: 14px; }
        .navBadge { margin-left: auto; background: ${p.paper}; color: ${p.inkSoft}; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px; }
        .navBtn.on .navBadge { background: ${p.rose}; color: ${p.onAcc}; }
        .subNav { margin: 2px 0 6px 30px; border-left: 1px solid ${p.line}; }
        .subBtn { display: block; width: 100%; text-align: left; border: 0; background: transparent; font: inherit; font-size: 12.5px; font-weight: 600; color: ${p.inkSoft}; padding: 7px 12px; cursor: pointer; border-left: 2px solid transparent; margin-left: -1px; }
        .subBtn:hover { color: ${p.ink}; }
        .subBtn.on { color: ${p.ink}; border-left-color: ${p.rose}; background: ${p.paper}; border-radius: 0 8px 8px 0; }
        .sideFoot { border-top: 1px solid ${p.line}; padding: 12px 10px; }
        .sideFootLbl { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: ${p.inkSoft}; padding: 0 12px 6px; }
        .roleBtn { width: 100%; text-align: left; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: ${p.inkSoft}; padding: 8px 12px; border-radius: 9px; cursor: pointer; }
        .roleBtn:hover { background: ${p.paper}; }
