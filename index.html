.bs-wrap { font-family: 'Manrope', system-ui, sans-serif; color: #E9F0EB; display: flex; flex-direction: column; gap: 14px; }
.bs-wrap *, .bs-wrap *::before, .bs-wrap *::after { box-sizing: border-box; }
.bs-wrap b, .bs-wrap strong { font-weight: 700; }

/* --- \u0437\u0430\u0433\u043B\u0430\u0432\u0438\u0435 \u043D\u0430 \u0435\u043A\u0440\u0430\u043D\u0430 --------------------------------- */
.bs-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
.bs-headL { display: flex; flex-direction: column; gap: 6px; }
.bs-titleRow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.bs-title { font-size: 26px; font-weight: 600; letter-spacing: -0.2px; margin: 0; }
.bs-badge { background: #14312A; color: #25C08A; font-size: 11px; font-weight: 800; letter-spacing: 0.7px; padding: 5px 10px; border-radius: 20px; white-space: nowrap; }
.bs-sub { font-size: 13px; color: #8FA39A; text-wrap: pretty; max-width: 640px; }
.bs-year { font-size: 12px; color: #8FA39A; padding-top: 6px; white-space: nowrap; }

/* --- \u043A\u0430\u0440\u0442\u0438 ---------------------------------------------- */
.bs-card { background: #151F1B; border: 1px solid #26332D; border-radius: 14px; padding: 20px 22px; }
.bs-cardTop { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
.bs-cardTitle { font-size: 17px; font-weight: 600; }
.bs-cardNote { font-size: 12.5px; color: #8FA39A; }
.bs-label { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: #8FA39A; }
.bs-tabnum { font-variant-numeric: tabular-nums; }
.bs-total { color: #25C08A; font-size: 15px; font-variant-numeric: tabular-nums; }

/* --- 1. \u0414\u043D\u0435\u0441 -------------------------------------------- */
.bs-today { display: flex; align-items: flex-start; gap: 36px; padding: 24px 26px; }
.bs-todayL { display: flex; flex-direction: column; gap: 2px; min-width: 250px; }
.bs-big { display: flex; align-items: baseline; gap: 10px; }
.bs-big b { font-size: 76px; line-height: 1; font-weight: 700; color: #25C08A; font-variant-numeric: tabular-nums; }
.bs-big.bs-zero { padding-top: 12px; }
.bs-big.bs-zero b { color: #26332D; }
.bs-bigUnit { font-size: 17px; color: #8FA39A; }
.bs-bigEmpty { font-size: 15px; color: #8FA39A; max-width: 160px; }
.bs-todayR { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
.bs-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.bs-chip { display: inline-flex; align-items: center; gap: 8px; background: #1B2621; border: 1px solid #26332D; border-radius: 10px; padding: 8px 12px; font-size: 13.5px; }
.bs-chip b { color: #25C08A; font-variant-numeric: tabular-nums; }
.bs-dash { font-size: 13.5px; color: #8FA39A; opacity: 0.7; }

/* --- 2. \u041A\u043E\u043D\u0442\u0435\u043A\u0441\u0442\u0435\u043D \u0440\u0435\u0434 ---------------------------------- */
.bs-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.bs-kpi { background: #151F1B; border: 1px solid #26332D; border-radius: 14px; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; }
.bs-kpiVal { display: flex; align-items: baseline; gap: 10px; }
.bs-kpiVal b { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bs-kpiVal .bs-accent { color: #25C08A; }
.bs-kpiVal .bs-gold { color: #D9A93C; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bs-kpiUnit { font-size: 13px; color: #8FA39A; }
.bs-kpiFoot { font-size: 11.5px; color: #8FA39A; }
.bs-up { color: #6FC08C; font-size: 13px; font-weight: 700; }
.bs-down { color: #E58C7D; font-size: 13px; font-weight: 700; }
.bs-flat { color: #8FA39A; font-size: 13px; font-weight: 700; }

/* --- 3. \u0413\u043E\u0434\u0438\u0448\u043D\u0430 \u0434\u0438\u0430\u0433\u0440\u0430\u043C\u0430 -------------------------------- */
.bs-legend { display: flex; gap: 14px; font-size: 11px; color: #8FA39A; white-space: nowrap; }
.bs-legend span { display: inline-flex; align-items: center; gap: 6px; }
.bs-swatch { width: 10px; height: 10px; border-radius: 2px; display: block; }
.bs-swLow { background: rgba(37, 192, 138, 0.14); }
.bs-swPeak { background: rgba(217, 169, 60, 0.16); }
.bs-chart { display: flex; align-items: stretch; gap: 6px; height: 200px; padding-top: 8px; }
.bs-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; border-radius: 8px; padding: 6px 4px; border: 1px solid transparent; background: none; cursor: pointer; font: inherit; }
.bs-col.bs-summer { background: rgba(37, 192, 138, 0.10); }
.bs-col.bs-peak { background: rgba(217, 169, 60, 0.13); }
.bs-col.bs-on { border-color: #25C08A; }
.bs-col.bs-future { cursor: default; }
.bs-colNum { text-align: center; font-size: 13px; font-weight: 700; color: #8FA39A; font-variant-numeric: tabular-nums; }
.bs-col.bs-on .bs-colNum { color: #25C08A; }
.bs-col.bs-future .bs-colNum { color: #26332D; }
.bs-bar { min-height: 2px; border-radius: 5px 5px 2px 2px; background: rgba(37, 192, 138, 0.42); }
.bs-col.bs-on .bs-bar { background: #25C08A; }
.bs-col.bs-future .bs-bar { background: #26332D; }
.bs-col:hover:not(.bs-future) .bs-bar { background: rgba(37, 192, 138, 0.68); }
.bs-col:focus-visible { outline: 2px solid #25C08A; outline-offset: 2px; }
.bs-axis { display: flex; gap: 6px; padding-top: 8px; margin-top: 8px; border-top: 1px solid #26332D; }
.bs-axis span { flex: 1; text-align: center; font-size: 11.5px; font-weight: 500; color: #8FA39A; }
.bs-axis span.bs-on { color: #E9F0EB; font-weight: 700; }
.bs-axis span.bs-future { color: #3B4C44; }

/* --- 4. \u0414\u043E\u043B\u043D\u0438 \u0434\u0432\u0435 \u043A\u043E\u043B\u043E\u043D\u0438 -------------------------------- */
.bs-cols2 { display: grid; grid-template-columns: 1fr 1.25fr; gap: 14px; align-items: start; }
.bs-mRow { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-top: 1px solid #26332D; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; cursor: pointer; font: inherit; color: inherit; text-align: left; }
.bs-mRow:hover { background: #1B2621; }
.bs-mRow:focus-visible { outline: 2px solid #25C08A; outline-offset: -2px; }
.bs-mName { min-width: 104px; font-size: 13px; font-weight: 500; }
.bs-mRow.bs-on .bs-mName, .bs-mRow.bs-on .bs-mNum { color: #25C08A; font-weight: 700; }
.bs-track { flex: 1; height: 8px; background: #1B2621; border-radius: 4px; overflow: hidden; }
.bs-track i { display: block; height: 100%; border-radius: 4px; background: rgba(37, 192, 138, 0.5); }
.bs-mRow.bs-peak .bs-track i { background: #D9A93C; }
.bs-mRow.bs-on .bs-track i { background: #25C08A; }
.bs-mNum { min-width: 26px; text-align: right; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bs-mDelta { min-width: 36px; text-align: right; font-size: 11px; font-weight: 700; color: #8FA39A; }
.bs-mDelta.bs-up { color: #6FC08C; }
.bs-mDelta.bs-down { color: #E58C7D; }
.bs-typesFoot { margin-top: 14px; padding-top: 12px; border-top: 1px solid #26332D; display: flex; flex-direction: column; gap: 8px; }
.bs-typeRow { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-top: 1px solid #26332D; }
.bs-typeName { min-width: 118px; font-size: 13px; }
.bs-typeRow:first-of-type .bs-track i { background: #25C08A; }
.bs-typeNum { min-width: 26px; text-align: right; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bs-typeShare { min-width: 34px; text-align: right; font-size: 11px; color: #8FA39A; font-variant-numeric: tabular-nums; }

/* --- 5. \u0414\u0435\u043D \u043F\u043E \u0434\u0435\u043D -------------------------------------- */
.bs-dRow { display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-top: 1px solid #26332D; }
.bs-dDate { min-width: 88px; font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.bs-dDate.bs-isToday { color: #25C08A; }
.bs-dTypes { flex: 1; font-size: 12.5px; color: #8FA39A; text-wrap: pretty; }
.bs-dNum { color: #25C08A; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bs-zeroNote { margin-top: 14px; padding: 10px 14px; background: #1B2621; border-left: 3px solid #26332D; border-radius: 0 8px 8px 0; font-size: 12.5px; color: #8FA39A; }
.bs-empty { font-size: 13px; color: #8FA39A; padding: 8px 0; }

/* --- \u043C\u043E\u0431\u0438\u043B\u043D\u043E: \u0431\u044A\u0440\u0437\u0430 \u0441\u043F\u0440\u0430\u0432\u043A\u0430 \u2014 \u0434\u043D\u0435\u0441 + \u043C\u0435\u0441\u0435\u0446\u044A\u0442 ------------ */
@media (max-width: 760px) {
  .bs-wrap { gap: 12px; }
  .bs-head { flex-direction: column; gap: 6px; }
  .bs-year { padding-top: 0; }
  .bs-title { font-size: 20px; }
  .bs-card { padding: 16px; border-radius: 14px; }
  .bs-today { flex-direction: column; gap: 12px; padding: 16px; }
  .bs-todayL { min-width: 0; }
  .bs-big b { font-size: 62px; }
  .bs-todayR { padding-top: 0; }
  .bs-kpis { grid-template-columns: 1fr; gap: 10px; }
  .bs-kpi { flex-direction: row; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .bs-kpiFoot { width: 100%; }
  .bs-chart { height: 96px; gap: 3px; }
  .bs-col { padding: 2px; border-radius: 5px; }
  .bs-colNum { display: none; }
  .bs-axis { gap: 3px; }
  .bs-axis span { font-size: 9px; }
  .bs-legend { display: none; }
  .bs-cols2 { grid-template-columns: 1fr; }
  .bs-mName { min-width: 78px; }
  .bs-mDelta { min-width: 30px; }
  .bs-dDate { min-width: 68px; font-size: 13px; }
  .bs-dTypes { flex-basis: 100%; order: 3; font-size: 11.5px; }
}
